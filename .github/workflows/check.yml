# Έλεγχοι σε κάθε κλάδο εκτός από το main: τρέχουν όλοι οι έλεγχοι (με ώρα Αθήνας),
# χτίζεται APK release όπως στο main, αλλά χωρίς το κλειδί (για να πιάνονται λάθη Kotlin και R8) και βγαίνουν στιγμιότυπα στο branch
# «screenshots-dev». Επίσης ανοίγει την εφαρμογή σε emulator, καθαρή και ως αναβάθμιση της τελευταίας έκδοσης (smoke).
# Τίποτα δεν δημοσιεύεται στο Releases: αυτό γίνεται μόνο από το main. Το κλειδί υπογραφής δεν χρησιμοποιείται ΠΟΤΕ εδώ.
#
# Ασφάλεια (έλεγχος 9/11): κάθε ενέργεια κλειδωμένη σε πλήρες SHA· τα jobs που χτίζουν έχουν μόνο ανάγνωση· τα
# στιγμιότυπα τα ανεβάζουν μικρά jobs «…-push» (εγγραφή, χωρίς χτίσιμο), μέσω artifact.
name: Έλεγχος κλάδου

on:
  push:
    branches-ignore: [main, screenshots, screenshots-dev, food-raw, widget-shots, watch-shots]

permissions: {}

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TZ: Europe/Athens
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9 # σταθερή έκδοση: μια νέα Flutter δεν αλλάζει σιωπηλά την εφαρμογή
          cache: true

      - name: Συμπλήρωση αρχείων Android
        run: |
          echo "::notice title=Flutter::$(flutter --version | head -1)"
          bash tools/ci/prepare_android.sh

      # Το Gradle κατεβαίνει από το GitHub· μνήμη + ξαναδοκιμή, γιατί κάποιες φορές απαντά 504 (8/11).
      - name: Gradle (μνήμη και κατέβασμα με ξαναδοκιμή)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2/files-2.1
            ~/.gradle/caches/modules-2/metadata-*
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle.kts') }}
          restore-keys: gradle-
      - name: Gradle (κατέβασμα)
        run: |
          cd android
          for i in 1 2 3 4 5; do ./gradlew --version --console=plain >/dev/null 2>&1 && exit 0; echo "Ξαναδοκιμή $i"; sleep $((i * 20)); done
          ./gradlew --version --console=plain

      - name: Ανάλυση κώδικα (σταματά μόνο σε σφάλματα)
        run: |
          set -o pipefail
          # Έλεγχος 4/11 (A14): σφάλματα του analyzer σταματούν το χτίσιμο· προειδοποιήσεις και υποδείξεις όχι (φαίνονται).
          if ! flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log; then
            msg=$(grep -E " error " analyze.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Ανάλυση κώδικα::$msg"
            exit 1
          fi
          echo "::notice title=Ανάλυση κώδικα::$(tail -1 analyze.log | tr -cd '[:print:]' | tail -c 120)"

      # Έλεγχος 2, C10: ο μεσάζων της Oura τρέχει πραγματικά με node (ψεύτικα Netlify.env και fetch).
      - name: Μεσάζων Oura (node)
        run: node test/node/oura_token_test.mjs site/netlify/functions/oura-token.mjs

      # Η πολιτική απορρήτου λέει την αλήθεια για ό,τι ζητά η εφαρμογή (Oura, Samsung, Sentry…), έλεγχος 9/11 (V-A-23).
      - name: Πολιτική απορρήτου ↔ κώδικας
        run: python3 -I tools/ci/check_privacy.py

      - name: Έλεγχοι (ώρα Αθήνας)
        run: |
          set -o pipefail
          date
          # Round 7 (R7-A12-10): και οι δοκιμές σε υποφακέλους του test/ (πριν: μόνο test/*_test.dart, όποια μπει σε
          # υποφάκελο δεν έτρεχε ποτέ).
          files=$(find test -name '*_test.dart' | LC_ALL=C sort | grep -v -e screens_test -e sentry_live_test -e oura_sandbox_live_test)
          if ! flutter test $files 2>&1 | tee tests.log; then
            grep -E -B2 -A8 "Error:|Expected:|FAILED|failed" tests.log | head -150 > errors.txt || true
            [ -s errors.txt ] || tail -80 tests.log > errors.txt
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' errors.txt)
            echo "::error title=Σφάλμα ελέγχων::$msg"
            exit 1
          fi
          # Έλεγχος 13/11 (S12-17): «πράσινο» μόνο αν έτρεξαν πράγματι οι δοκιμές (ίδιο όριο με το android.yml). Η Flutter
          # γράφει στο τέλος «N tests passed» (GitHub Actions) ή «+N: All tests passed!».
          n=$(grep -aoE '[0-9]+ tests passed' tests.log | tail -1 | grep -oE '^[0-9]+' || true)
          [ -n "$n" ] || n=$(grep -aoE '\+[0-9]+[^+]*All tests passed' tests.log | tail -1 | grep -oE '[0-9]+' | head -1 || true)
          echo "::notice title=Έλεγχοι::${n:-0} δοκιμές Dart πέρασαν"
          # Round 7 (R7-A12-10): κατώτατο λίγο κάτω από όσες τρέχουν (#104: ≈ 1.590). Πριν ήταν 950: έλειπε το 40 % και
          # έμενε πράσινο. Αν σβηστούν δοκιμές σκόπιμα, το κατώτατο κατεβαίνει μαζί, με εξήγηση στο commit.
          # Round 8 (R8-A12-2): ≈ 3% κάτω από το #105 (1.832)· το 1550 άφηνε να χαθούν όλες οι δοκιμές του γύρου 7.
          if [ "${n:-0}" -lt 1777 ]; then
            echo "::error title=Έλεγχοι::Έτρεξαν μόνο ${n:-0} δοκιμές Dart (κατώτατο 1777). Λείπουν δοκιμές από το σύνολο;"
            exit 1
          fi

      - name: Χτίσιμο APK (release χωρίς κλειδί, μόνο για έλεγχο)
        run: |
          set -o pipefail
          if ! flutter build apk --release --target-platform android-arm64 2>&1 | tee build.log; then
            grep -E -A3 "^e: |error:|Error:|What went wrong|ERROR|Missing class|Unresolved reference|Execution failed" build.log | head -150 > errors.txt || true
            [ -s errors.txt ] || tail -120 build.log > errors.txt
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' errors.txt)
            echo "::error title=Σφάλμα χτισίματος::$msg"
            exit 1
          fi

      - name: Έλεγχοι Kotlin (JVM, χωρίς συσκευή)
        run: |
          set -o pipefail
          cd android
          if ! ./gradlew :app:testDebugUnitTest --console=plain 2>&1 | tee ../kotlin-tests.log; then
            grep -E -A6 "FAILED|AssertionError|^e: |What went wrong" ../kotlin-tests.log | head -80 > ../errors.txt || true
            [ -s ../errors.txt ] || tail -80 ../kotlin-tests.log > ../errors.txt
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' ../errors.txt)
            echo "::error title=Έλεγχοι Kotlin::$msg"
            exit 1
          fi
          # Η Flutter βάζει το build του app στο ../build/app.
          # Round 8 (R8-A12-2): όσοι ΕΤΡΕΞΑΝ = tests − skipped (ένα @Ignore δεν μετρά ως «εντάξει»)· και όχι λιγότεροι από τα
          # @Test του κώδικα (περιθώριο 2 για ένα assume): μια κλάση που δεν τρέχει πια (λάθος import, abstract, μετονομασία)
          # φαίνεται αμέσως.
          n=$(find .. -path '*test-results/testDebugUnitTest/*' -name '*.xml' -exec grep -ho '<testsuite [^>]*>' {} + 2>/dev/null \
            | awk '{t=0; s=0; if (match($0, /tests="[0-9]+"/)) t=substr($0, RSTART+7, RLENGTH-8); if (match($0, /skipped="[0-9]+"/)) s=substr($0, RSTART+9, RLENGTH-10); r+=t-s} END {print r+0}' || true)
          want=$(grep -rhE '^\s*@Test\b' app/src/test | wc -l || true)
          echo "::notice title=Έλεγχοι Kotlin::${n:-0} έλεγχοι εντάξει (στον κώδικα: ${want:-0} @Test)"
          # Έλεγχος 13/11 (S12-17): «0 έλεγχοι εντάξει» δεν περνά πια (π.χ. αν το «flutter create» πάψει να βάζει το src/test).
          # Round 7 (R7-A12-10): λίγο κάτω από όσους υπάρχουν (#104: 73· πριν 40).
          # Round 8 (R8-A12-2): κατώτατο ≈ 3% κάτω από το #105 (85).
          if [ "${n:-0}" -lt 82 ] || [ $(( ${n:-0} + 2 )) -lt "${want:-0}" ]; then
            echo "::error title=Έλεγχοι Kotlin::Έτρεξαν ${n:-0} έλεγχοι Kotlin του κινητού, ενώ ο κώδικας έχει ${want:-0} @Test (κατώτατο 82). Δεν έτρεξε κάποια κλάση ή μπήκε @Ignore;"
            exit 1
          fi

      # Ρολόι (8/11): χωριστή εφαρμογή Wear OS στο android/wear. Μπαίνει στο settings μόνο εδώ, για να μην αγγίζει το χτίσιμο του κινητού.
      - name: Ρολόι (Wear OS) — έλεγχοι και χτίσιμο
        run: |
          set -o pipefail
          cd android
          grep -q '":wear"' settings.gradle.kts || echo 'include(":wear")' >> settings.gradle.kts
          if ! ./gradlew :wear:testDebugUnitTest :wear:assembleRelease --console=plain 2>&1 | tee ../wear.log; then
            grep -E -A6 "FAILED|AssertionError|^e: |error:|What went wrong|Unresolved reference" ../wear.log | head -120 > ../errors.txt || true
            [ -s ../errors.txt ] || tail -100 ../wear.log > ../errors.txt
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' ../errors.txt)
            echo "::error title=Ρολόι::$msg"
            exit 1
          fi
          # Round 7 (R7-A12-10): ΜΟΝΟ του ρολογιού (../build/wear, εκεί που βγαίνει και το APK του), λίγο κάτω από όσους
          # υπάρχουν (#104: 133). Πριν μετρούσε κινητό + ρολόι μαζί με κατώτατο 120: το ρολόι μπορούσε να χάσει τα 2/3.
          # Round 8 (R8-A12-2): όπως στο κινητό, tests − skipped και όχι λιγότεροι από τα @Test του κώδικα· κατώτατο ≈ 3% κάτω
          # από το #105 (167).
          n=$(find ../build/wear -path '*test-results/testDebugUnitTest/*' -name '*.xml' -exec grep -ho '<testsuite [^>]*>' {} + 2>/dev/null \
            | awk '{t=0; s=0; if (match($0, /tests="[0-9]+"/)) t=substr($0, RSTART+7, RLENGTH-8); if (match($0, /skipped="[0-9]+"/)) s=substr($0, RSTART+9, RLENGTH-10); r+=t-s} END {print r+0}' || true)
          want=$(grep -rhE '^\s*@Test\b' wear/src/test | wc -l || true)
          echo "::notice title=Έλεγχοι Kotlin::${n:-0} έλεγχοι ρολογιού εντάξει (στον κώδικα: ${want:-0} @Test)"
          if [ "${n:-0}" -lt 162 ] || [ $(( ${n:-0} + 2 )) -lt "${want:-0}" ]; then
            echo "::error title=Ρολόι::Έτρεξαν ${n:-0} έλεγχοι Kotlin του ρολογιού, ενώ ο κώδικας έχει ${want:-0} @Test (κατώτατο 162). Έτρεξαν οι έλεγχοι του ρολογιού;"
            exit 1
          fi
          ls -l ../build/wear/outputs/apk/release/ || true
          for a in ../build/wear/outputs/apk/release/*.apk; do python3 -I ../tools/check_wear_capability.py "$a"; done
          echo "::notice title=Ρολόι::$(du -h ../build/wear/outputs/apk/release/*.apk | head -1)"

      # fix-sdk37: τα APK που βγαίνουν έχουν πράγματι targetSdk 37 (κινητό και ρολόι· το «flutter create» δεν το αλλάζει σιωπηλά).
      - name: Επίπεδο Android των APK (targetSdk 37)
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          bt="$(ls -d "$sdk"/build-tools/* | sort -V | tail -1)"
          for a in build/app/outputs/flutter-apk/app-release.apk build/wear/outputs/apk/release/*.apk; do
            t=$("$bt/aapt2" dump badging "$a" | grep -o "targetSdkVersion:'[0-9]*'" || true)
            c=$("$bt/aapt2" dump badging "$a" | grep -o "compileSdkVersion='[0-9]*'" || true)
            echo "$a · $t · $c"
            [ "$t" = "targetSdkVersion:'37'" ] || { echo "::error title=targetSdk::$a: «$t» (αναμενόταν 37)"; exit 1; }
          done
          echo "::notice title=targetSdk::κινητό και ρολόι: 37 (Android 17)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: watch-shots
          path: android/wear/build/watch-shots/
          retention-days: 3
          if-no-files-found: ignore

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success()
        with:
          name: wear-check
          path: build/wear/outputs/apk/release/*.apk
          retention-days: 7

  watch-shots-push:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: tools/ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: watch-shots
          path: ${{ runner.temp }}/watch-shots
      - name: Στιγμιότυπα ρολογιού στο branch watch-shots
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          bash tools/ci/push_dir.sh "$RUNNER_TEMP/watch-shots" watch-shots "Ρολόι · $REF · $SHA"

  # Oura: ο πραγματικός κώδικας ανάγνωσης πάνω στα συνθετικά δεδομένα του sandbox της Oura (χωρίς δαχτυλίδι).
  # Δεν μπλοκάρει αν η Oura δεν απαντά· αποτυγχάνει αν η απάντηση δεν διαβάζεται σωστά.
  oura-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TZ: Europe/Athens
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Ανάγνωση sandbox Oura
        run: |
          set -o pipefail
          if ! flutter test test/oura_sandbox_live_test.dart --dart-define=OURA_LIVE=1 2>&1 | tee sandbox.log; then
            msg=$(grep -E -B2 -A10 "Expected|Error|Exception|FAILED" sandbox.log | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Sandbox Oura::$msg"
            exit 1
          fi
          echo "::notice title=Sandbox Oura::$(cat oura_sandbox_result.txt 2>/dev/null || echo 'χωρίς αποτέλεσμα')"

  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9 # σταθερή έκδοση: μια νέα Flutter δεν αλλάζει σιωπηλά την εφαρμογή
          cache: true

      # Round 7 (R7-A12-10): ΣΚΟΠΙΜΑ χωρίς σύγκριση με αποθηκευμένες εικόνες (goldens). Οι εικόνες εξαρτώνται από τη
      # γραμματοσειρά και το Skia του runner και αλλάζουν σε κάθε σχεδιαστική αλλαγή: μια σύγκριση εικονοστοιχείο προς
      # εικονοστοιχείο θα έβγαινε κόκκινη χωρίς λάθος, και θα έπρεπε να «ενημερώνεται» τυφλά. Εδώ σταματούν σφάλματα,
      # ξεχειλίσματα και οι έλεγχοι (expect) του screens_test· τις οθόνες τις κοιτάζει άνθρωπος (κλάδος screenshots-dev).
      - name: Ζωγράφισμα οθονών
        run: |
          set -o pipefail
          if ! flutter test test/screens_test.dart --update-goldens 2>&1 | tee shots.log; then
            grep -E -A4 "Error:|error:|EXCEPTION|was thrown|overflowed|Expected|Test failed" shots.log | head -150 > errors.txt || true
            [ -s errors.txt ] || tail -120 shots.log > errors.txt
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' errors.txt)
            echo "::error title=Σφάλμα στιγμιοτύπων::$msg"
            exit 1
          fi

      - name: Log μαζί με τα στιγμιότυπα
        if: always()
        run: |
          [ -d test/shots ] || exit 0
          cp shots.log test/shots/ 2>/dev/null || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: screens
          path: test/shots/
          retention-days: 3
          if-no-files-found: ignore

  shots-push:
    needs: shots
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: tools/ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: screens
          path: ${{ runner.temp }}/shots
      - name: Ανέβασμα στο branch screenshots-dev
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          bash tools/ci/push_dir.sh "$RUNNER_TEMP/shots" screenshots-dev "Στιγμιότυπα κλάδου $REF · $SHA"

  # Ανοίγει την εφαρμογή σε emulator Android 14, καθαρή ΚΑΙ ως αναβάθμιση της τελευταίας έκδοσης. Αν κλείνει, δείχνει
  # σφάλμα Dart ή δεν διαβάζει τα δεδομένα της προηγούμενης, ο κλάδος δεν συγχωνεύεται.
  # (Μετά την #62: ένας κανόνας R8 που έλειπε την έκλεινε, ενώ όλοι οι άλλοι έλεγχοι ήταν πράσινοι.)
  # fix-sdk37 (10/11): δοκιμάστηκε και emulator Android 17 (EMU_API=37 στο tools/ci/emulator.sh). Στο CI ήταν ασταθής
  # (χώρος, υπηρεσία package, SurfaceFlinger «display event receiver status=-32») → μένει μόνο το Android 14.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Ελεύθερος χώρος στον δίσκο
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY" || true

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Ο emulator ξεκινά όσο χτίζονται τα APK (κερδίζει λεπτά).
      - name: Emulator (εκκίνηση στο παρασκήνιο)
        run: bash tools/ci/emulator.sh start

      - name: Συμπλήρωση αρχείων Android
        run: bash tools/ci/prepare_android.sh

      # Το Gradle κατεβαίνει από το GitHub· μνήμη + ξαναδοκιμή, γιατί κάποιες φορές απαντά 504 (8/11).
      - name: Gradle (μνήμη και κατέβασμα με ξαναδοκιμή)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2/files-2.1
            ~/.gradle/caches/modules-2/metadata-*
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle.kts') }}
          restore-keys: gradle-
      - name: Gradle (κατέβασμα)
        run: |
          cd android
          for i in 1 2 3 4 5; do ./gradlew --version --console=plain >/dev/null 2>&1 && exit 0; echo "Ξαναδοκιμή $i"; sleep $((i * 20)); done
          ./gradlew --version --console=plain

      - name: APK release για emulator (x86_64, ίδιοι κανόνες R8)
        run: |
          flutter build apk --release --target-platform android-x64 --build-number=2
          cp build/app/outputs/flutter-apk/app-release.apk new.apk

      - name: APK της τελευταίας έκδοσης (για τη δοκιμή αναβάθμισης)
        run: |
          if bash tools/ci/build_old_apk.sh old.apk new.apk; then
            echo "::notice title=Αναβάθμιση::Παλιά έκδοση έτοιμη ($(du -h old.apk | cut -f1))"
          else
            echo "::warning title=Αναβάθμιση::Δεν χτίστηκε η τελευταία έκδοση· η δοκιμή αναβάθμισης παραλείπεται"
          fi

      - name: Άνοιγμα, αναβάθμιση και widgets σε emulator
        run: |
          set -o pipefail
          export PATH="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platform-tools:$PATH"
          bash tools/ci/emulator.sh wait || { echo "::error title=Άνοιγμα::Ο emulator δεν ξεκίνησε· ο έλεγχος δεν έγινε"; exit 1; }
          if bash tools/perf/smoke.sh new.apk 2>&1 | tee smoke.log; then
            echo "::notice title=Άνοιγμα::$(tail -1 smoke.log)"
          else
            msg=$(head -60 smoke.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Η εφαρμογή δεν ανοίγει σωστά::$msg"
            exit 1
          fi
          if [ -f old.apk ]; then
            if bash tools/perf/upgrade.sh old.apk new.apk 2>&1 | tee upgrade.log; then
              echo "::notice title=Αναβάθμιση::$(grep -E '^Αναβάθμιση [0-9]' upgrade.log | tail -1) · $(tail -1 upgrade.log)"
            else
              msg=$(grep -v '^$' upgrade.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
              echo "::error title=Η αναβάθμιση χαλά::$msg"
              exit 1
            fi
          fi
          if timeout 300 bash tools/perf/widget_shots.sh > widget.log 2>&1; then
            echo "::notice title=Widgets::$(tail -1 widget.log)"
          else
            msg=$(head -60 widget.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Οθόνη ρύθμισης widget::$msg"
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: widget-shots
          path: widget_shots/
          retention-days: 3
          if-no-files-found: ignore

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: smoke
          path: |
            smoke_shots/
            smoke.log
            upgrade.log
            crash.log
          retention-days: 7
          if-no-files-found: ignore

  widget-shots-push:
    needs: smoke
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: tools/ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: widget-shots
          path: ${{ runner.temp }}/widget-shots
      - name: Στιγμιότυπα widgets (κλάδος widget-shots)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          bash tools/ci/push_dir.sh "$RUNNER_TEMP/widget-shots" widget-shots "widget shots $SHA"
