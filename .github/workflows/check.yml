# Έλεγχοι σε κάθε κλάδο εκτός από το main: τρέχουν όλοι οι έλεγχοι (με ώρα Αθήνας),
# χτίζεται APK release όπως στο main, αλλά χωρίς το κλειδί (για να πιάνονται λάθη Kotlin και R8) και βγαίνουν στιγμιότυπα στο branch
# «screenshots-dev». Επίσης ανοίγει την εφαρμογή σε emulator (smoke). Τίποτα δεν δημοσιεύεται στο Releases: αυτό γίνεται μόνο από το main.
name: Έλεγχος κλάδου

on:
  push:
    branches-ignore: [main, screenshots, screenshots-dev, food-raw, widget-shots, watch-shots]

permissions:
  contents: write

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Athens
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9 # σταθερή έκδοση: μια νέα Flutter δεν αλλάζει σιωπηλά την εφαρμογή
          cache: true

      - name: Συμπλήρωση αρχείων Android
        run: |
          echo "::notice title=Flutter::$(flutter --version | head -1)"
          flutter create --org gr.ygeiaforma --project-name ygeia_forma --platforms android .
          cat android/ygeia/app-extra.gradle.kts >> android/app/build.gradle.kts
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          # Σύνδεση Oura: οθόνη επιστροφής ygeiaforma://oura-callback και <queries> για browser (η MainActivity δεν αλλάζει).
          python3 tools/android/patch_manifest.py android/app/src/main/AndroidManifest.xml

      # Το Gradle κατεβαίνει από το GitHub· μνήμη + ξαναδοκιμή, γιατί κάποιες φορές απαντά 504 (8/11).
      - name: Gradle (μνήμη και κατέβασμα με ξαναδοκιμή)
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Gradle (κατέβασμα)
        run: |
          cd android
          for i in 1 2 3 4 5; do ./gradlew --version --console=plain >/dev/null 2>&1 && exit 0; echo "Ξαναδοκιμή $i"; sleep $((i * 20)); done
          ./gradlew --version --console=plain

      - name: Ανάλυση κώδικα (σταματά μόνο σε σφάλματα)
        run: |
          set -o pipefail
          # Έλεγχος 4/11 (A14): σφάλματα του analyzer σταματούν το χτίσιμο· προειδοποιήσεις και υποδείξεις όχι (φαίνονται).
          if ! flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log; then
            msg=$(grep -E " error " analyze.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Ανάλυση κώδικα::$msg"
            exit 1
          fi
          echo "::notice title=Ανάλυση κώδικα::$(tail -1 analyze.log | tr -cd '[:print:]' | tail -c 120)"

      # Έλεγχος 2, C10: ο μεσάζων της Oura τρέχει πραγματικά με node (ψεύτικα Netlify.env και fetch).
      - name: Μεσάζων Oura (node)
        run: node test/node/oura_token_test.mjs site/netlify/functions/oura-token.mjs

      - name: Έλεγχοι (ώρα Αθήνας)
        run: |
          set -o pipefail
          date
          files=$(ls test/*_test.dart | grep -v -e screens_test -e sentry_live_test -e oura_sandbox_live_test)
          if ! flutter test $files 2>&1 | tee tests.log; then
            grep -E -B2 -A8 "Error:|Expected:|FAILED|failed" tests.log | head -150 > errors.txt || true
            [ -s errors.txt ] || tail -80 tests.log > errors.txt
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' errors.txt)
            echo "::error title=Σφάλμα ελέγχων::$msg"
            exit 1
          fi
          echo "::notice title=Έλεγχοι::$(grep -a 'All tests passed' tests.log | tail -1 | tr -cd '[:print:]' | tail -c 120)"

      - name: Χτίσιμο APK (release χωρίς κλειδί, μόνο για έλεγχο)
        run: |
          set -o pipefail
          if ! flutter build apk --release --target-platform android-arm64 2>&1 | tee build.log; then
            grep -E -A3 "^e: |error:|Error:|What went wrong|ERROR|Missing class|Unresolved reference|Execution failed" build.log | head -150 > errors.txt || true
            [ -s errors.txt ] || tail -120 build.log > errors.txt
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' errors.txt)
            echo "::error title=Σφάλμα χτισίματος::$msg"
            exit 1
          fi

      - name: Έλεγχοι Kotlin (JVM, χωρίς συσκευή)
        run: |
          set -o pipefail
          cd android
          if ! ./gradlew :app:testDebugUnitTest --console=plain 2>&1 | tee ../kotlin-tests.log; then
            grep -E -A6 "FAILED|AssertionError|^e: |What went wrong" ../kotlin-tests.log | head -80 > ../errors.txt || true
            [ -s ../errors.txt ] || tail -80 ../kotlin-tests.log > ../errors.txt
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' ../errors.txt)
            echo "::error title=Έλεγχοι Kotlin::$msg"
            exit 1
          fi
          # Η Flutter βάζει το build του app στο ../build/app.
          n=$(find .. -path '*test-results/testDebugUnitTest/*' -name '*.xml' -exec grep -ho '<testsuite [^>]*tests="[0-9]*"' {} + 2>/dev/null \
            | grep -o 'tests="[0-9]*"' | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}' || true)
          echo "::notice title=Έλεγχοι Kotlin::${n:-0} έλεγχοι εντάξει"

      # Ρολόι (8/11): χωριστή εφαρμογή Wear OS στο android/wear. Μπαίνει στο settings μόνο εδώ, για να μην αγγίζει το χτίσιμο του κινητού.
      - name: Ρολόι (Wear OS) — έλεγχοι και χτίσιμο
        run: |
          set -o pipefail
          cd android
          grep -q '":wear"' settings.gradle.kts || echo 'include(":wear")' >> settings.gradle.kts
          if ! ./gradlew :wear:testDebugUnitTest :wear:assembleRelease --console=plain 2>&1 | tee ../wear.log; then
            grep -E -A6 "FAILED|AssertionError|^e: |error:|What went wrong|Unresolved reference" ../wear.log | head -120 > ../errors.txt || true
            [ -s ../errors.txt ] || tail -100 ../wear.log > ../errors.txt
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' ../errors.txt)
            echo "::error title=Ρολόι::$msg"
            exit 1
          fi
          ls -l ../build/wear/outputs/apk/release/ || true
          echo "::notice title=Ρολόι::$(du -h ../build/wear/outputs/apk/release/*.apk | head -1)"

      - name: Στιγμιότυπα ρολογιού στο branch watch-shots
        if: always()
        run: |
          d=android/wear/build/watch-shots
          [ -d "$d" ] || exit 0
          cd "$d"
          git init -q
          git checkout -q -b watch-shots
          git add .
          git -c user.name="ygeia-ci" -c user.email="ci@ygeia.local" commit -qm "Ρολόι · ${{ github.ref_name }} · ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" watch-shots

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wear-check
          path: build/wear/outputs/apk/release/*.apk
          retention-days: 7

  # Oura: ο πραγματικός κώδικας ανάγνωσης πάνω στα συνθετικά δεδομένα του sandbox της Oura (χωρίς δαχτυλίδι).
  # Δεν μπλοκάρει αν η Oura δεν απαντά· αποτυγχάνει αν η απάντηση δεν διαβάζεται σωστά.
  oura-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Europe/Athens
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Ανάγνωση sandbox Oura
        run: |
          set -o pipefail
          if ! flutter test test/oura_sandbox_live_test.dart --dart-define=OURA_LIVE=1 2>&1 | tee sandbox.log; then
            msg=$(grep -E -B2 -A10 "Expected|Error|Exception|FAILED" sandbox.log | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Sandbox Oura::$msg"
            exit 1
          fi
          echo "::notice title=Sandbox Oura::$(cat oura_sandbox_result.txt 2>/dev/null || echo 'χωρίς αποτέλεσμα')"

  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9 # σταθερή έκδοση: μια νέα Flutter δεν αλλάζει σιωπηλά την εφαρμογή
          cache: true

      - name: Ζωγράφισμα οθονών
        run: |
          set -o pipefail
          if ! flutter test test/screens_test.dart --update-goldens 2>&1 | tee shots.log; then
            grep -E -A4 "Error:|error:|EXCEPTION|was thrown|overflowed|Expected|Test failed" shots.log | head -150 > errors.txt || true
            [ -s errors.txt ] || tail -120 shots.log > errors.txt
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' errors.txt)
            echo "::error title=Σφάλμα στιγμιοτύπων::$msg"
            exit 1
          fi

      - name: Ανέβασμα στο branch screenshots-dev
        if: always()
        run: |
          [ -d test/shots ] || exit 0
          cp shots.log test/shots/ 2>/dev/null || true
          cd test/shots
          git init -q
          git checkout -q -b screenshots-dev
          git add .
          git -c user.name="ygeia-ci" -c user.email="ci@ygeia.local" commit -qm "Στιγμιότυπα κλάδου ${{ github.ref_name }} · ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots-dev

  # Ανοίγει την εφαρμογή σε emulator Android 14. Αν κλείνει στο άνοιγμα, ο κλάδος δεν συγχωνεύεται.
  # (Μετά την #62: ένας κανόνας R8 που έλειπε την έκλεινε, ενώ όλοι οι άλλοι έλεγχοι ήταν πράσινοι.)
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Ελεύθερος χώρος στον δίσκο
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY" || true

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Συμπλήρωση αρχείων Android
        run: |
          flutter create --org gr.ygeiaforma --project-name ygeia_forma --platforms android .
          cat android/ygeia/app-extra.gradle.kts >> android/app/build.gradle.kts
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          # Σύνδεση Oura: οθόνη επιστροφής ygeiaforma://oura-callback και <queries> για browser (η MainActivity δεν αλλάζει).
          python3 tools/android/patch_manifest.py android/app/src/main/AndroidManifest.xml

      # Το Gradle κατεβαίνει από το GitHub· μνήμη + ξαναδοκιμή, γιατί κάποιες φορές απαντά 504 (8/11).
      - name: Gradle (μνήμη και κατέβασμα με ξαναδοκιμή)
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Gradle (κατέβασμα)
        run: |
          cd android
          for i in 1 2 3 4 5; do ./gradlew --version --console=plain >/dev/null 2>&1 && exit 0; echo "Ξαναδοκιμή $i"; sleep $((i * 20)); done
          ./gradlew --version --console=plain

      - name: APK release για emulator (x86_64, ίδιοι κανόνες R8)
        run: flutter build apk --release --target-platform android-x64

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Άνοιγμα σε emulator
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BIN="$SDK/cmdline-tools/latest/bin"
          IMG="system-images;android-34;google_apis;x86_64"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$BIN/sdkmanager" --licenses > /dev/null || true
          "$BIN/sdkmanager" "emulator" "platform-tools" "$IMG" > sdk.log 2>&1 || true
          echo no | "$BIN/avdmanager" create avd -n smoke -k "$IMG" -d pixel_6 --force > /dev/null 2>&1 || \
            echo no | "$BIN/avdmanager" create avd -n smoke -k "$IMG" --force > /dev/null
          export PATH="$SDK/platform-tools:$SDK/emulator:$PATH"
          nohup emulator -avd smoke -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim \
            -no-snapshot -camera-back none -camera-front none -memory 4096 > emu.log 2>&1 &
          if ! timeout 600 adb wait-for-device; then
            echo "::warning title=Άνοιγμα::Ο emulator δεν ξεκίνησε· ο έλεγχος ανοίγματος δεν έγινε"; exit 1
          fi
          for i in $(seq 1 120); do
            [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ] && break
            sleep 5
          done
          sleep 15
          if bash tools/perf/smoke.sh build/app/outputs/flutter-apk/app-release.apk > smoke.log 2>&1; then
            echo "::notice title=Άνοιγμα::$(tail -1 smoke.log)"
          else
            msg=$(head -60 smoke.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Η εφαρμογή κλείνει στο άνοιγμα::$msg"
            exit 1
          fi
          if timeout 300 bash tools/perf/widget_shots.sh > widget.log 2>&1; then
            echo "::notice title=Widgets::$(tail -1 widget.log)"
          else
            msg=$(head -60 widget.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Οθόνη ρύθμισης widget::$msg"
            exit 1
          fi

      - name: Στιγμιότυπα widgets (κλάδος widget-shots)
        if: always()
        run: |
          [ -d widget_shots ] && [ -n "$(ls widget_shots)" ] || exit 0
          cd widget_shots
          git init -q && git checkout -q -b widget-shots && git add . && git -c user.name=ci -c user.email=ci@x commit -qm "widget shots ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" widget-shots
