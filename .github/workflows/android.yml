# Χτίζει την εφαρμογή Android σε κάθε αλλαγή στο main και βάζει το APK
# στη σελίδα Releases του repository (έκδοση «latest»).
name: Χτίσιμο Android

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sentry_test:
        description: "Στείλε και ένα δοκιμαστικό σφάλμα στο Sentry"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9 # σταθερή έκδοση: μια νέα Flutter δεν αλλάζει σιωπηλά την εφαρμογή
          cache: true

      - name: Συμπλήρωση αρχείων Android
        run: |
          flutter --version
          echo "::notice title=Flutter::$(flutter --version | head -1)"
          # Φτιάχνει μόνο όσα αρχεία λείπουν· τα δικά μας μένουν όπως είναι.
          flutter create --org gr.ygeiaforma --project-name ygeia_forma --platforms android .
          test -f android/app/build.gradle.kts || { echo "Λείπει το android/app/build.gradle.kts"; exit 1; }
          cat android/ygeia/app-extra.gradle.kts >> android/app/build.gradle.kts
          sed -i 's/android:label="ygeia_forma"/android:label="Υγεία \&amp; Φόρμα"/' android/app/src/main/AndroidManifest.xml
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml
          # Διαδίκτυο: για το Open Food Facts (barcode) και την αναφορά σφαλμάτων (Sentry). Το Samsung Health δεν το χρειάζεται.
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          # Σύνδεση Oura: οθόνη επιστροφής ygeiaforma://oura-callback και <queries> για browser (η MainActivity δεν αλλάζει).
          python3 tools/android/patch_manifest.py android/app/src/main/AndroidManifest.xml
          grep -n 'INTERNET' android/app/src/main/AndroidManifest.xml

      - name: Προσωρινή μνήμη για το κλειδί υπογραφής
        uses: actions/cache@v4
        with:
          path: ~/.ygeia-signing
          key: ygeia-signing-v1

      - name: Κλειδί υπογραφής
        env:
          KEYSTORE_B64: ${{ secrets.YGEIA_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.YGEIA_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            mkdir -p "$HOME/.ygeia-secret"
            echo "$KEYSTORE_B64" | base64 -d > "$HOME/.ygeia-secret/release.jks"
            store="$HOME/.ygeia-secret/release.jks"
            pw="$KEYSTORE_PASSWORD"
            echo "Κλειδί από τα Secrets του repository."
          elif [ -f "$HOME/.ygeia-signing/release.jks" ] && [ -f "$HOME/.ygeia-signing/password" ]; then
            store="$HOME/.ygeia-signing/release.jks"
            pw="$(cat "$HOME/.ygeia-signing/password")"
            echo "::warning title=Κλειδί υπογραφής::Το κλειδί βρίσκεται μόνο στην προσωρινή μνήμη του GitHub, που σβήνεται μετά από 7 μέρες χωρίς χτίσιμο. Πρέπει να μπει στα Secrets (YGEIA_KEYSTORE_B64, YGEIA_KEYSTORE_PASSWORD)."
          else
            # Ποτέ νέο κλειδί: ένα νέο κλειδί σημαίνει ότι η έκδοση δεν μπαίνει πάνω στην παλιά
            # και η απεγκατάσταση σβήνει τα δεδομένα του κινητού. Καλύτερα να σταματήσει το χτίσιμο.
            echo "::error title=Κλειδί υπογραφής::Δεν βρέθηκε το κλειδί υπογραφής (ούτε στα Secrets ούτε στην προσωρινή μνήμη). Το χτίσιμο σταματά για να μη φτιαχτεί έκδοση με άλλο κλειδί."
            exit 1
          fi
          echo "::add-mask::$pw"
          fp="$(keytool -list -v -keystore "$store" -storepass "$pw" -alias ygeia | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')"
          [ -n "$fp" ] || { echo "::error title=Κλειδί υπογραφής::Δεν διαβάστηκε το κλειδί (λάθος κωδικός ή αρχείο)."; exit 1; }
          echo "::notice title=Αποτύπωμα κλειδιού::SHA-256 $fp"
          # App Link της Oura: το site/.well-known/assetlinks.json πρέπει να έχει αυτό το αποτύπωμα (ανεβαίνει με το χέρι).
          # Δύο αντίγραφα: το drag and drop του Netlify παραλείπει τον κρυφό .well-known (δες site/README.md).
          for f in site/.well-known/assetlinks.json site/assetlinks.json; do
            if [ -f "$f" ] && ! grep -q "$fp" "$f"; then
              echo "::warning title=assetlinks.json::Το $f δεν έχει το αποτύπωμα του κλειδιού υπογραφής. Η επιστροφή από την Oura θα περνά από τη σελίδα αντί για App Link ώσπου να διορθωθεί και να ξαναανέβει στο Netlify."
            fi
          done
          echo "YGEIA_KEYSTORE=$store" >> "$GITHUB_ENV"
          echo "YGEIA_KEYSTORE_PASSWORD=$pw" >> "$GITHUB_ENV"

      # Μόνο όταν το ζητήσουμε ([export-key] στο μήνυμα του commit): αντίγραφο του κλειδιού για 1 μέρα,
      # ώστε να μπει στα Secrets του repository και σε διαχειριστή κωδικών.
      - name: Αντίγραφο κλειδιού υπογραφής
        if: contains(github.event.head_commit.message, '[export-key]')
        run: |
          mkdir -p key-export
          cp "$YGEIA_KEYSTORE" key-export/release.jks
          base64 -w0 "$YGEIA_KEYSTORE" > key-export/YGEIA_KEYSTORE_B64.txt
          printf '%s' "$YGEIA_KEYSTORE_PASSWORD" > key-export/YGEIA_KEYSTORE_PASSWORD.txt
          printf '%s\n' \
            "Κλειδί υπογραφής της εφαρμογής «Υγεία & Φόρμα»." \
            "1. Το περιεχόμενο του YGEIA_KEYSTORE_B64.txt μπαίνει στο Secret YGEIA_KEYSTORE_B64." \
            "2. Το περιεχόμενο του YGEIA_KEYSTORE_PASSWORD.txt μπαίνει στο Secret YGEIA_KEYSTORE_PASSWORD." \
            "3. Όλος ο φάκελος φυλάγεται σε διαχειριστή κωδικών. Αν χαθεί, οι νέες εκδόσεις δεν θα μπαίνουν πάνω στην παλιά." \
            > key-export/ODIGIES.txt

      - uses: actions/upload-artifact@v4
        if: contains(github.event.head_commit.message, '[export-key]')
        with:
          name: kleidi-ypografis
          path: key-export/
          retention-days: 1

      - name: Έλεγχοι
        env:
          TZ: Europe/Athens
        run: |
          set -o pipefail
          # Όλοι οι έλεγχοι εκτός από τα στιγμιότυπα και τη ζωντανή δοκιμή Sentry, με ώρα Αθήνας
          # (ώστε να πιάνονται λάθη στην αλλαγή ώρας).
          files=$(ls test/*_test.dart | grep -v -e screens_test -e sentry_live_test -e oura_sandbox_live_test)
          if ! flutter test $files 2>&1 | tee tests.log; then
            grep -E -B2 -A8 "Error:|Expected:|FAILED|failed" tests.log | head -120 > errors.txt || true
            [ -s errors.txt ] || tail -80 tests.log > errors.txt
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' errors.txt)
            echo "::error title=Σφάλμα ελέγχων::$msg"
            exit 1
          fi

      - name: Χτίσιμο APK
        run: |
          set -o pipefail
          if ! flutter build apk --release --target-platform android-arm64 \
            --build-name=0.1.${{ github.run_number }} --build-number=${{ github.run_number }} 2>&1 | tee build.log; then
            # Τα σφάλματα γίνονται «σημειώσεις» (annotations), ώστε να διαβάζονται και χωρίς το πλήρες log.
            grep -E -A3 "^e: |error:|Error:|What went wrong|ERROR|Missing class|Unresolved reference|Execution failed" build.log | head -150 > errors.txt || true
            [ -s errors.txt ] || tail -120 build.log > errors.txt
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' errors.txt)
            echo "::error title=Σφάλμα χτισίματος::$msg"
            exit 1
          fi
          cp build/app/outputs/flutter-apk/app-release.apk ygeia-forma-${{ github.run_number }}.apk
          ls -lh ygeia-forma-*.apk

      # Μόνο όταν το ζητήσουμε: πραγματικό σφάλμα στο Sentry με τον κώδικα της εφαρμογής και την ίδια έκδοση.
      - name: Δοκιμαστικό σφάλμα στο Sentry
        if: contains(github.event.head_commit.message, '[sentry-test]') || inputs.sentry_test
        run: |
          set -o pipefail
          if ! flutter test test/sentry_live_test.dart --dart-define=SENTRY_LIVE=1 \
            --dart-define=APP_VERSION=0.1.${{ github.run_number }} 2>&1 | tee live.log; then
            msg=$(tail -60 live.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Δοκιμή Sentry::$msg"
            exit 1
          fi
          # Να έτρεξε πραγματικά (όχι «skipped»).
          test -f sentry_live_ok || { echo "::error title=Δοκιμή Sentry::Ο έλεγχος δεν έτρεξε"; exit 1; }
          echo "::notice title=Δοκιμή Sentry::Στάλθηκε δοκιμαστικό σφάλμα για ygeia-forma@0.1.${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ygeia-forma-${{ github.run_number }}
          path: ygeia-forma-*.apk
          retention-days: 14

      - name: Δημοσίευση στο Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ygeia-forma-${{ github.run_number }}.apk \
            --target "${{ github.sha }}" \
            --title "Τελευταία έκδοση · #${{ github.run_number }}" \
            --notes "Χτίστηκε από το commit ${{ github.sha }}. Κατέβασε το .apk στο Fold και πάτα «Εγκατάσταση»."

  # Στιγμιότυπα οθονών με δείγμα δεδομένων, για έλεγχο της εμφάνισης.
  # Ανεβαίνουν στο branch «screenshots» (όχι στο main).
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9 # σταθερή έκδοση: μια νέα Flutter δεν αλλάζει σιωπηλά την εφαρμογή
          cache: true

      - name: Ζωγράφισμα οθονών
        run: |
          set -o pipefail
          if ! flutter test test/screens_test.dart --update-goldens 2>&1 | tee shots.log; then
            grep -E -A4 "Error:|error:|EXCEPTION|was thrown|overflowed|Expected|Test failed" shots.log | head -150 > errors.txt || true
            [ -s errors.txt ] || tail -120 shots.log > errors.txt
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' errors.txt)
            echo "::error title=Σφάλμα στιγμιοτύπων::$msg"
          fi
          ls -la test/shots || true

      - name: Ανέβασμα στο branch screenshots
        if: always()
        run: |
          [ -d test/shots ] || exit 0
          cp shots.log test/shots/ 2>/dev/null || true
          cd test/shots
          git init -q
          git checkout -q -b screenshots
          git add .
          git -c user.name="ygeia-ci" -c user.email="ci@ygeia.local" commit -qm "Στιγμιότυπα #${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
