# Χτίζει την εφαρμογή Android σε κάθε αλλαγή στο main και βάζει τα APK στη σελίδα Releases (έκδοση «latest»).
#
# Ασφάλεια (έλεγχος 9/11, V-A-20): το κλειδί υπογραφής ΔΕΝ μπαίνει ποτέ στο job που χτίζει και ελέγχει (εκεί τρέχουν
# δεκάδες εξαρτήσεις Gradle/Maven και η Flutter). Το «build» βγάζει APK χωρίς το σταθερό κλειδί· τα υπογράφει μόνο το
# μικρό job «sign», σε καθαρό μηχάνημα, με το κλειδί μόνο στο βήμα της υπογραφής (tools/ci/sign_apks.sh), και ελέγχει
# ότι το πιστοποιητικό είναι ΑΚΡΙΒΩΣ το σταθερό (YGEIA_CERT_SHA256). Κάθε ενέργεια (action) είναι κλειδωμένη σε
# πλήρες SHA. Κάθε job έχει μόνο τα δικαιώματα που χρειάζεται· γράφουν μόνο τα «publish», «shots-push», «old-cache».
#
# Τα APK «δένονται» με SHA-256 (outputs των jobs) από το build στο sign και από το sign στο publish.
#
# Δοκιμή χωρίς δημοσίευση: Actions › «Χτίσιμο Android» › Run workflow σε ΑΛΛΟΝ κλάδο. Τρέχουν χτίσιμο, έλεγχοι, άνοιγμα,
# αναβάθμιση και υπογραφή (με έλεγχο πιστοποιητικού)· το Releases και τα στιγμιότυπα του main ΔΕΝ αλλάζουν (μόνο στο main).
# Έλεγχος 13/11 (S10-2): ΣΗΜΕΡΑ υπογράφει και ο άλλος κλάδος, γιατί τα δύο secrets του κλειδιού είναι secrets του
# repository (τα βλέπει κάθε workflow κάθε κλάδου). Environment «release» ΔΕΝ υπάρχει ακόμα και το job «sign» δεν δηλώνει
# κανένα· το πώς γίνεται (βήματα του χρήστη στο GitHub και μετά μία γραμμή εδώ) είναι στο README, «Κλειδί υπογραφής».
#
# ΜΗΝ μετονομάσεις και μην ξαναφτιάξεις αυτό το αρχείο (S10-8): ο αριθμός έκδοσης (versionCode του κινητού N, του
# ρολογιού 1000000+N) είναι το run_number ΑΥΤΟΥ του αρχείου. Με άλλο όνομα ξαναρχίζει από το 1, και το Android αρνείται
# να βάλει μικρότερο αριθμό πάνω στην εγκατεστημένη εφαρμογή.
name: Χτίσιμο Android

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sentry_test:
        description: "Στείλε και ένα δοκιμαστικό σφάλμα στο Sentry"
        type: boolean
        default: false

# Τίποτα από προεπιλογή· κάθε job δηλώνει ό,τι χρειάζεται.
permissions: {}

env:
  # Το δημόσιο αποτύπωμα (SHA-256) του πιστοποιητικού υπογραφής· ίδιο με το site/public/assetlinks.json. ΔΕΝ αλλάζει.
  YGEIA_CERT_SHA256: a4433ab12214f1c88f500f38604323730d0f0d6f3dda8305730d79b596213752

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # SHA-256 των APK χωρίς υπογραφή: τα outputs ενός job δεν τα αλλάζει κανένα άλλο job, άρα το «sign» υπογράφει
    # ΜΟΝΟ ό,τι έβγαλε αυτό το job (έλεγχος 9/11, S-6).
    outputs:
      phone: ${{ steps.sums.outputs.phone }}
      watch: ${{ steps.sums.outputs.watch }}
    # Νέα αλλαγή στο main ακυρώνει το χτίσιμο της παλιάς (όχι όμως μια δημοσίευση που τρέχει).
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9 # σταθερή έκδοση: μια νέα Flutter δεν αλλάζει σιωπηλά την εφαρμογή
          cache: true

      - name: Συμπλήρωση αρχείων Android
        run: |
          echo "::notice title=Flutter::$(flutter --version | head -1)"
          bash tools/ci/prepare_android.sh

      # Το Gradle κατεβαίνει από το GitHub· μνήμη + ξαναδοκιμή, γιατί κάποιες φορές απαντά 504 (8/11).
      - name: Gradle (μνήμη και κατέβασμα με ξαναδοκιμή)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2/files-2.1
            ~/.gradle/caches/modules-2/metadata-*
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle.kts') }}
          restore-keys: gradle-
      - name: Gradle (κατέβασμα)
        run: |
          cd android
          for i in 1 2 3 4 5; do ./gradlew --version --console=plain >/dev/null 2>&1 && exit 0; echo "Ξαναδοκιμή $i"; sleep $((i * 20)); done
          ./gradlew --version --console=plain

      - name: Ανάλυση κώδικα (σταματά μόνο σε σφάλματα)
        run: |
          set -o pipefail
          # Έλεγχος 4/11 (A14): σφάλματα του analyzer σταματούν το χτίσιμο· προειδοποιήσεις και υποδείξεις όχι (φαίνονται).
          if ! flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log; then
            msg=$(grep -E " error " analyze.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Ανάλυση κώδικα::$msg"
            exit 1
          fi
          echo "::notice title=Ανάλυση κώδικα::$(tail -1 analyze.log | tr -cd '[:print:]' | tail -c 120)"

      # Η πολιτική απορρήτου λέει την αλήθεια για ό,τι ζητά η εφαρμογή (Oura, Samsung, Sentry…), έλεγχος 9/11 (V-A-23).
      - name: Πολιτική απορρήτου ↔ κώδικας
        run: python3 -I tools/ci/check_privacy.py

      # Έλεγχος 13/11 (S10-9): και στο main, όπως στο check.yml. Ο μεσάζων της Oura τρέχει πραγματικά με node (ψεύτικα
      # Netlify.env και fetch)· το Netlify ανεβάζει το site/ σε κάθε push στο main, χωρίς να περιμένει αυτό το workflow.
      - name: Μεσάζων Oura (node)
        run: node test/node/oura_token_test.mjs site/netlify/functions/oura-token.mjs

      - name: Έλεγχοι
        env:
          TZ: Europe/Athens
        run: |
          set -o pipefail
          # Όλοι οι έλεγχοι εκτός από τα στιγμιότυπα και τη ζωντανή δοκιμή Sentry, με ώρα Αθήνας
          # (ώστε να πιάνονται λάθη στην αλλαγή ώρας).
          # Round 7 (R7-A12-10): και οι δοκιμές σε υποφακέλους του test/ (πριν: μόνο test/*_test.dart).
          files=$(find test -name '*_test.dart' | LC_ALL=C sort | grep -v -e screens_test -e sentry_live_test -e oura_sandbox_live_test)
          if ! flutter test $files 2>&1 | tee tests.log; then
            grep -E -B2 -A8 "Error:|Expected:|FAILED|failed" tests.log | head -120 > errors.txt || true
            [ -s errors.txt ] || tail -80 tests.log > errors.txt
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' errors.txt)
            echo "::error title=Σφάλμα ελέγχων::$msg"
            exit 1
          fi
          # Έλεγχος 13/11 (S12-17): «πράσινο» μόνο αν έτρεξαν πράγματι οι δοκιμές. Η Flutter γράφει στο τέλος
          # «N tests passed» (GitHub Actions) ή «+N: All tests passed!». Κάτω από το όριο = κάτι έβγαλε δοκιμές από το σύνολο.
          n=$(grep -aoE '[0-9]+ tests passed' tests.log | tail -1 | grep -oE '^[0-9]+' || true)
          [ -n "$n" ] || n=$(grep -aoE '\+[0-9]+[^+]*All tests passed' tests.log | tail -1 | grep -oE '[0-9]+' | head -1 || true)
          echo "::notice title=Έλεγχοι::${n:-0} δοκιμές Dart πέρασαν"
          # Round 7 (R7-A12-10): κατώτατο λίγο κάτω από όσες τρέχουν (#104: ≈ 1.590· πριν 950), ίδιο με το check.yml.
          if [ "${n:-0}" -lt 1550 ]; then
            echo "::error title=Έλεγχοι::Έτρεξαν μόνο ${n:-0} δοκιμές Dart (κατώτατο 1550). Λείπουν δοκιμές από το σύνολο;"
            exit 1
          fi

      # Χωρίς το σταθερό κλειδί (το Gradle βάζει το προσωρινό κλειδί debug του runner)· το υπογράφει το job «sign».
      - name: Χτίσιμο APK
        env:
          N: ${{ github.run_number }}
        run: |
          set -o pipefail
          if ! flutter build apk --release --target-platform android-arm64 \
            --build-name="0.1.$N" --build-number="$N" 2>&1 | tee build.log; then
            # Τα σφάλματα γίνονται «σημειώσεις» (annotations), ώστε να διαβάζονται και χωρίς το πλήρες log.
            grep -E -A3 "^e: |error:|Error:|What went wrong|ERROR|Missing class|Unresolved reference|Execution failed" build.log | head -150 > errors.txt || true
            [ -s errors.txt ] || tail -120 build.log > errors.txt
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' errors.txt)
            echo "::error title=Σφάλμα χτισίματος::$msg"
            exit 1
          fi
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk "out/ygeia-forma-$N.apk"
          ls -lh out/

      # Και στο main (A14): οι έλεγχοι Kotlin σε απλό JVM, πριν δημοσιευτεί η έκδοση.
      - name: Έλεγχοι Kotlin (JVM, χωρίς συσκευή)
        run: |
          set -o pipefail
          cd android
          if ! ./gradlew :app:testDebugUnitTest --console=plain 2>&1 | tee ../kotlin-tests.log; then
            grep -E -A6 "FAILED|AssertionError|^e: |What went wrong" ../kotlin-tests.log | head -80 > ../errors.txt || true
            [ -s ../errors.txt ] || tail -80 ../kotlin-tests.log > ../errors.txt
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' ../errors.txt)
            echo "::error title=Έλεγχοι Kotlin::$msg"
            exit 1
          fi
          # Η Flutter βάζει το build του app στο ../build/app.
          n=$(find .. -path '*test-results/testDebugUnitTest/*' -name '*.xml' -exec grep -ho '<testsuite [^>]*tests="[0-9]*"' {} + 2>/dev/null \
            | grep -o 'tests="[0-9]*"' | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}' || true)
          echo "::notice title=Έλεγχοι Kotlin::${n:-0} έλεγχοι εντάξει"
          # Έλεγχος 13/11 (S12-17): «0 έλεγχοι εντάξει» δεν περνά πια (π.χ. αν το «flutter create» πάψει να βάζει το src/test).
          # Round 7 (R7-A12-10): λίγο κάτω από όσους υπάρχουν (#104: 73· πριν 40).
          if [ "${n:-0}" -lt 70 ]; then
            echo "::error title=Έλεγχοι Kotlin::Έτρεξαν μόνο ${n:-0} έλεγχοι Kotlin του κινητού (κατώτατο 70)"
            exit 1
          fi

      # Ρολόι (8/11): η εφαρμογή Wear OS. Χωρίς κλειδί εδώ· το job «sign» τη υπογράφει με το ΙΔΙΟ κλειδί με το κινητό
      # (το θέλει η σύνδεση κινητού–ρολογιού).
      - name: Χτίσιμο εφαρμογής ρολογιού
        env:
          YGEIA_BUILD: ${{ github.run_number }}
          N: ${{ github.run_number }}
        run: |
          set -o pipefail
          cd android
          grep -q '":wear"' settings.gradle.kts || echo 'include(":wear")' >> settings.gradle.kts
          if ! ./gradlew :wear:testDebugUnitTest :wear:assembleRelease --console=plain 2>&1 | tee ../wear.log; then
            grep -E -A6 "FAILED|AssertionError|^e: |error:|What went wrong|Unresolved reference" ../wear.log | head -120 > ../errors.txt || true
            [ -s ../errors.txt ] || tail -100 ../wear.log > ../errors.txt
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' ../errors.txt)
            echo "::error title=Ρολόι::$msg"
            exit 1
          fi
          cd ..
          # Round 7 (R7-A12-10): ΜΟΝΟ του ρολογιού (build/wear, εκεί που βγαίνει και το APK του), λίγο κάτω από όσους
          # υπάρχουν (#104: 133). Πριν μετρούσε κινητό + ρολόι μαζί με κατώτατο 120: το ρολόι μπορούσε να χάσει τα 2/3.
          n=$(find build/wear -path '*test-results/testDebugUnitTest/*' -name '*.xml' -exec grep -ho '<testsuite [^>]*tests="[0-9]*"' {} + 2>/dev/null \
            | grep -o 'tests="[0-9]*"' | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}' || true)
          echo "::notice title=Έλεγχοι Kotlin::${n:-0} έλεγχοι ρολογιού εντάξει"
          if [ "${n:-0}" -lt 128 ]; then
            echo "::error title=Ρολόι::Έτρεξαν μόνο ${n:-0} έλεγχοι Kotlin του ρολογιού (κατώτατο 128). Έτρεξαν οι έλεγχοι του ρολογιού;"
            exit 1
          fi
          w=$(ls build/wear/outputs/apk/release/*.apk 2>/dev/null | head -1)
          test -n "$w" || { echo "::error title=Ρολόι::Δεν βγήκε APK ρολογιού"; ls -l build/wear/outputs/apk/release/ || true; exit 1; }
          python3 -I tools/check_wear_capability.py "$w"
          cp "$w" "out/ygeia-forma-watch-$N.apk"
          ls -lh out/

      # Έλεγχος 13/11 (S10-9): και στο main, πάνω στα APK που πράγματι δημοσιεύονται (ίδιο βήμα με το check.yml, fix-sdk37):
      # έχουν targetSdk 37 (κινητό και ρολόι· το «flutter create» δεν το αλλάζει σιωπηλά).
      - name: Επίπεδο Android των APK (targetSdk 37)
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          bt="$(ls -d "$sdk"/build-tools/* | sort -V | tail -1)"
          for a in build/app/outputs/flutter-apk/app-release.apk build/wear/outputs/apk/release/*.apk; do
            t=$("$bt/aapt2" dump badging "$a" | grep -o "targetSdkVersion:'[0-9]*'" || true)
            c=$("$bt/aapt2" dump badging "$a" | grep -o "compileSdkVersion='[0-9]*'" || true)
            echo "$a · $t · $c"
            [ "$t" = "targetSdkVersion:'37'" ] || { echo "::error title=targetSdk::$a: «$t» (αναμενόταν 37)"; exit 1; }
          done
          echo "::notice title=targetSdk::κινητό και ρολόι: 37 (Android 17)"

      # Μόνο όταν το ζητήσουμε: πραγματικό σφάλμα στο Sentry με τον κώδικα της εφαρμογής και την ίδια έκδοση.
      - name: Δοκιμαστικό σφάλμα στο Sentry
        if: contains(github.event.head_commit.message, '[sentry-test]') || inputs.sentry_test
        env:
          N: ${{ github.run_number }}
        run: |
          set -o pipefail
          if ! flutter test test/sentry_live_test.dart --dart-define=SENTRY_LIVE=1 \
            --dart-define=APP_VERSION="0.1.$N" 2>&1 | tee live.log; then
            msg=$(tail -60 live.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Δοκιμή Sentry::$msg"
            exit 1
          fi
          # Να έτρεξε πραγματικά (όχι «skipped»).
          test -f sentry_live_ok || { echo "::error title=Δοκιμή Sentry::Ο έλεγχος δεν έτρεξε"; exit 1; }
          echo "::notice title=Δοκιμή Sentry::Στάλθηκε δοκιμαστικό σφάλμα για ygeia-forma@0.1.$N"

      - name: SHA-256 των APK (για το job «sign»)
        id: sums
        env:
          N: ${{ github.run_number }}
        run: |
          echo "phone=$(sha256sum "out/ygeia-forma-$N.apk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "watch=$(sha256sum "out/ygeia-forma-watch-$N.apk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          sha256sum out/*.apk

      # Χωρίς υπογραφή με το σταθερό κλειδί: μόνο για το job «sign» (3 μέρες, ώστε να γίνεται «Re-run» και την επομένη).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-${{ github.run_number }}
          path: out/*.apk
          retention-days: 3
          if-no-files-found: error

  # Στιγμιότυπα οθονών με δείγμα δεδομένων, για έλεγχο της εμφάνισης. Τα ανεβάζει στο branch «screenshots» το
  # «shots-push» (μόνο στο main).
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-shots-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9 # σταθερή έκδοση: μια νέα Flutter δεν αλλάζει σιωπηλά την εφαρμογή
          cache: true

      # Round 7 (R7-A12-10): ΣΚΟΠΙΜΑ χωρίς σύγκριση με αποθηκευμένες εικόνες (goldens): εξαρτώνται από τη γραμματοσειρά
      # και το Skia του runner και αλλάζουν σε κάθε σχεδιαστική αλλαγή, άρα θα έβγαιναν κόκκινες χωρίς λάθος. Σταματούν
      # σφάλματα, ξεχειλίσματα και οι έλεγχοι (expect) του screens_test· τις οθόνες τις κοιτάζει άνθρωπος.
      - name: Ζωγράφισμα οθονών
        run: |
          set -o pipefail
          if ! flutter test test/screens_test.dart --update-goldens 2>&1 | tee shots.log; then
            grep -E -A4 "Error:|error:|EXCEPTION|was thrown|overflowed|Expected|Test failed" shots.log | head -150 > errors.txt || true
            [ -s errors.txt ] || tail -120 shots.log > errors.txt
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' errors.txt)
            echo "::error title=Σφάλμα στιγμιοτύπων::$msg"
            ls -la test/shots || true
            exit 1
          fi
          ls -la test/shots || true

      - name: Log μαζί με τα στιγμιότυπα
        if: always()
        run: |
          [ -d test/shots ] || exit 0
          cp shots.log test/shots/ 2>/dev/null || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: screens-${{ github.run_number }}
          path: test/shots/
          retention-days: 3
          if-no-files-found: ignore

  shots-push:
    needs: shots
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: tools/ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: screens-${{ github.run_number }}
          path: ${{ runner.temp }}/shots
      - name: Ανέβασμα στο branch screenshots
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.run_number }}
        run: |
          bash tools/ci/push_dir.sh "$RUNNER_TEMP/shots" screenshots "Στιγμιότυπα #$N"

  # Και στο main (A14): ανοίγει την εφαρμογή σε emulator Android 14, καθαρή ΚΑΙ ως αναβάθμιση της τελευταίας έκδοσης
  # (tools/perf/smoke.sh, tools/perf/upgrade.sh). Αν κλείνει, δείχνει σφάλμα Dart ή δεν διαβάζει τα δεδομένα της
  # προηγούμενης, η έκδοση ΔΕΝ υπογράφεται και ΔΕΝ δημοσιεύεται.
  # (Μετά την #62: ένας κανόνας R8 που έλειπε την έκλεινε, ενώ όλοι οι άλλοι έλεγχοι ήταν πράσινοι.)
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-smoke-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Ελεύθερος χώρος στον δίσκο
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY" || true

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Ο emulator ξεκινά όσο χτίζονται τα APK (κερδίζει λεπτά).
      - name: Emulator (εκκίνηση στο παρασκήνιο)
        run: bash tools/ci/emulator.sh start

      - name: Συμπλήρωση αρχείων Android
        run: bash tools/ci/prepare_android.sh

      # Το Gradle κατεβαίνει από το GitHub· μνήμη + ξαναδοκιμή, γιατί κάποιες φορές απαντά 504 (8/11).
      - name: Gradle (μνήμη και κατέβασμα με ξαναδοκιμή)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2/files-2.1
            ~/.gradle/caches/modules-2/metadata-*
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle.kts') }}
          restore-keys: gradle-
      - name: Gradle (κατέβασμα)
        run: |
          cd android
          for i in 1 2 3 4 5; do ./gradlew --version --console=plain >/dev/null 2>&1 && exit 0; echo "Ξαναδοκιμή $i"; sleep $((i * 20)); done
          ./gradlew --version --console=plain

      - name: APK release για emulator (x86_64, ίδιοι κανόνες R8)
        run: |
          flutter build apk --release --target-platform android-x64 --build-number=2
          cp build/app/outputs/flutter-apk/app-release.apk new.apk

      # Έλεγχος 13/11 (S10-6, S12-10): στο main η έκδοση ΔΕΝ βγαίνει χωρίς τη δοκιμή αναβάθμισης όταν υπάρχει προηγούμενη
      # έκδοση (είναι ο μόνος αυτόματος φύλακας του «καμία απώλεια δεδομένων στην αναβάθμιση»). Πριν, αν το APK της παλιάς
      # δεν έβγαινε, έμενε μία προειδοποίηση και η έκδοση δημοσιευόταν. Το script ξαναδοκιμάζει μόνο του το δίκτυο.
      # Έξοδος 3 = δεν υπάρχει προηγούμενη έκδοση (παράλειψη, σωστά)· 4 = υπάρχει αλλά δεν χτίστηκε.
      # Αν ο ΠΑΛΙΟΣ κώδικας δεν χτίζεται πια (π.χ. μετά από αλλαγή έκδοσης της Flutter): commit με «[skip-upgrade]» στο
      # μήνυμα αφήνει την έκδοση να βγει χωρίς τη δοκιμή, με προειδοποίηση.
      - name: APK της τελευταίας έκδοσης (για τη δοκιμή αναβάθμισης)
        env:
          SKIP_UPGRADE: ${{ contains(github.event.head_commit.message, '[skip-upgrade]') }}
        run: |
          rc=0
          bash tools/ci/build_old_apk.sh old.apk new.apk || rc=$?
          if [ "$rc" = 0 ]; then
            echo "::notice title=Αναβάθμιση::Παλιά έκδοση έτοιμη ($(du -h old.apk | cut -f1))"
          elif [ "$rc" = 3 ]; then
            rm -f old.apk
            echo "::warning title=Αναβάθμιση::Δεν υπάρχει προηγούμενη έκδοση· η δοκιμή αναβάθμισης παραλείπεται"
          elif [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$SKIP_UPGRADE" != "true" ]; then
            echo "::error title=Αναβάθμιση::Δεν χτίστηκε η τελευταία έκδοση, άρα η δοκιμή αναβάθμισης δεν μπορεί να γίνει και η έκδοση δεν βγαίνει. Ξανατρέξε το job· αν ο παλιός κώδικας δεν χτίζεται πια, commit με [skip-upgrade] στο μήνυμα."
            exit 1
          else
            rm -f old.apk
            echo "::warning title=Αναβάθμιση::Δεν χτίστηκε η τελευταία έκδοση· η δοκιμή αναβάθμισης παραλείπεται"
          fi

      # Round 7 (R7-A12-10): στο main το tools/perf/upgrade.sh αποτυγχάνει (όχι προειδοποίηση) όταν δεν μπορεί να δοκιμάσει
      # με δείγμα δεδομένων (χωρίς root, χωρίς sqlite3, δείγμα που δεν μπήκε). Εξαίρεση πάλι το «[skip-upgrade]».
      - name: Άνοιγμα και αναβάθμιση σε emulator
        env:
          SKIP_UPGRADE: ${{ contains(github.event.head_commit.message, '[skip-upgrade]') }}
        run: |
          set -o pipefail
          export PATH="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platform-tools:$PATH"
          bash tools/ci/emulator.sh wait || { echo "::error title=Άνοιγμα::Ο emulator δεν ξεκίνησε· ο έλεγχος δεν έγινε"; exit 1; }
          if bash tools/perf/smoke.sh new.apk 2>&1 | tee smoke.log; then
            echo "::notice title=Άνοιγμα::$(tail -1 smoke.log)"
          else
            msg=$(head -60 smoke.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Η εφαρμογή δεν ανοίγει σωστά::$msg"
            exit 1
          fi
          [ -f old.apk ] || exit 0
          if bash tools/perf/upgrade.sh old.apk new.apk 2>&1 | tee upgrade.log; then
            echo "::notice title=Αναβάθμιση::$(grep -E '^Αναβάθμιση [0-9]' upgrade.log | tail -1) · $(tail -1 upgrade.log)"
          else
            msg=$(grep -v '^$' upgrade.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Η αναβάθμιση χαλά::$msg"
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: smoke-${{ github.run_number }}
          path: |
            smoke_shots/
            smoke.log
            upgrade.log
            crash.log
          retention-days: 7
          if-no-files-found: ignore

  # Υπογραφή: ΜΟΝΟ εδώ υπάρχει το κλειδί, και μόνο στο βήμα «Υπογραφή». Κανένα χτίσιμο, καμία εξάρτηση, καμία μνήμη
  # (cache). Τρέχει μόνο αν πέρασαν χτίσιμο, έλεγχοι, άνοιγμα και αναβάθμιση.
  # Έλεγχος 13/11 (S10-9, S12-09): και τα στιγμιότυπα («shots»). Το screens_test είναι η μόνη δοκιμή που χτίζει όλες τις
  # οθόνες σε όλα τα πλάτη (κλειστό και ανοιχτό Fold, μεγάλα γράμματα, σκοτεινά θέματα)· πριν, μια οθόνη που ξεχείλιζε ή
  # πετούσε σφάλμα εκεί έδινε ένα κόκκινο job και η έκδοση υπογραφόταν και δημοσιευόταν κανονικά.
  sign:
    needs: [build, smoke, shots]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      phone: ${{ steps.sums.outputs.phone }}
      watch: ${{ steps.sums.outputs.watch }}
    concurrency:
      group: ${{ github.workflow }}-sign-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/ci
            site/public

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-${{ github.run_number }}
          path: apk

      - name: Είναι τα APK του «build»; (SHA-256)
        env:
          N: ${{ github.run_number }}
          P: ${{ needs.build.outputs.phone }}
          W: ${{ needs.build.outputs.watch }}
        run: |
          [ -n "$P" ] && [ -n "$W" ] || { echo "::error title=Υπογραφή::Λείπουν τα SHA-256 του build"; exit 1; }
          printf '%s  %s\n' "$P" "apk/ygeia-forma-$N.apk" "$W" "apk/ygeia-forma-watch-$N.apk" | sha256sum -c -

      - name: Υπογραφή (το κλειδί μόνο σε αυτό το βήμα)
        env:
          YGEIA_KEYSTORE_B64: ${{ secrets.YGEIA_KEYSTORE_B64 }}
          YGEIA_KEYSTORE_PASSWORD: ${{ secrets.YGEIA_KEYSTORE_PASSWORD }}
          N: ${{ github.run_number }}
        run: bash tools/ci/sign_apks.sh "apk/ygeia-forma-$N.apk" "apk/ygeia-forma-watch-$N.apk"

      - name: Σβήσιμο του κλειδιού (πάντα)
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/ygeia-ks"
          test ! -e "$RUNNER_TEMP/ygeia-ks" && echo "Κανένα αρχείο κλειδιού στο μηχάνημα"

      - name: SHA-256 των υπογεγραμμένων APK (για το job «publish»)
        id: sums
        env:
          N: ${{ github.run_number }}
        run: |
          echo "phone=$(sha256sum "apk/ygeia-forma-$N.apk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "watch=$(sha256sum "apk/ygeia-forma-watch-$N.apk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ygeia-forma-${{ github.run_number }}
          path: apk/*.apk
          # Δοκιμή σε άλλον κλάδο: 1 μέρα.
          retention-days: ${{ github.ref == 'refs/heads/main' && 14 || 1 }}
          if-no-files-found: error

  # Έλεγχος 2, C7: η έκδοση μπαίνει στο Releases ΜΟΝΟ αν πέρασαν χτίσιμο (έλεγχοι Dart/Kotlin), άνοιγμα, αναβάθμιση
  # και υπογραφή με το σωστό πιστοποιητικό. Μια έκδοση που κλείνει στο άνοιγμα δεν φτάνει ποτέ στο κινητό (η επιστροφή
  # σε παλιότερη θα ήθελε απεγκατάσταση, που σβήνει το ημερολόγιο φαγητού). Μόνο από το main.
  publish:
    needs: sign
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ygeia-forma-${{ github.run_number }}

      - name: Είναι τα APK του «sign»; (SHA-256)
        env:
          N: ${{ github.run_number }}
          P: ${{ needs.sign.outputs.phone }}
          W: ${{ needs.sign.outputs.watch }}
        run: |
          [ -n "$P" ] && [ -n "$W" ] || { echo "::error title=Δημοσίευση::Λείπουν τα SHA-256 του sign"; exit 1; }
          printf '%s  %s\n' "$P" "ygeia-forma-$N.apk" "$W" "ygeia-forma-watch-$N.apk" | sha256sum -c -

      - name: Δημοσίευση στο Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          N: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          apk="ygeia-forma-$N.apk"
          test -f "$apk"
          # Η εφαρμογή του ρολογιού μπαίνει δίπλα (εγκατάσταση στο ρολόι από υπολογιστή ή από το Play Console).
          watch="ygeia-forma-watch-$N.apk"
          extra=""
          [ -f "$watch" ] && extra="$watch"
          # Ποτέ παλιότερη έκδοση πάνω από νεότερη (αν δύο χτισίματα τελειώσουν με αντίστροφη σειρά).
          cur=$(gh api "repos/$GH_REPO/releases/tags/latest" --jq '.assets[].name' 2>/dev/null \
            | sed -n 's/^ygeia-forma-\([0-9][0-9]*\)\.apk$/\1/p' | head -1 || true)
          if [ -n "$cur" ] && [ "$cur" -gt "$N" ]; then
            # Έλεγχος 13/11 (S10-8): σφάλμα, όχι προειδοποίηση με πράσινο job. Αν ο αριθμός ξαναρχίσει ποτέ από χαμηλά (π.χ.
            # μετονομασία αυτού του αρχείου), οι εκδόσεις θα σταματούσαν σιωπηλά.
            echo "::error title=Δημοσίευση::Η «latest» είναι ήδη η νεότερη #$cur· η #$N δεν δημοσιεύεται (το Android δεν βάζει μικρότερο αριθμό πάνω σε μεγαλύτερο)"
            exit 1
          fi
          sums=$(sha256sum "$apk" $extra | awk '{print "- " $2 ": SHA-256 " $1}')
          # Πρώτα ένα αντίγραφο με δικό του όνομα: αν η δημοσίευση διακοπεί ανάμεσα στο σβήσιμο και στη δημιουργία της
          # «latest», η έκδοση υπάρχει ακόμα στο Releases.
          # Έλεγχος 13/11 (S10-8): αν υπάρχει ήδη (το ίδιο job ξανατρέχει μετά από μισή αποτυχία), δεν ξαναφτιάχνεται· πριν,
          # το «Re-run» σταματούσε εδώ («already exists») και η «latest» δεν ξαναγινόταν ποτέ.
          gh release view "build-$N" > /dev/null 2>&1 || gh release create "build-$N" "$apk" $extra --target "$SHA" \
            --title "Έκδοση #$N" --notes "Χτίστηκε από το commit $SHA." --prerelease
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$apk" $extra \
            --target "$SHA" \
            --title "Τελευταία έκδοση · #$N" \
            --notes "Χτίστηκε από το commit $SHA. Στο Fold κατέβασε το ygeia-forma-$N.apk και πάτα «Εγκατάσταση». Το ygeia-forma-watch-$N.apk είναι για το ρολόι (δεν μπαίνει στο κινητό).

          Έλεγχος αρχείων:
          $sums"
          gh release delete "build-$N" --yes --cleanup-tag || true
          # Τα παλιά «build-…» (π.χ. build-68) ΔΕΝ σβήνονται αυτόματα: είναι τα μόνα παλιά APK στο Releases (απόφαση χρήστη).
          echo "::notice title=Δημοσίευση::Τελευταία έκδοση #$N"

  # Έλεγχος 9/11 (V-A-21): η παλιά μνήμη Actions «ygeia-signing-v1» (είχε το κλειδί ΚΑΙ τον κωδικό, ως το b2af444)
  # σβήνεται αν υπάρχει ακόμα. Κανένα workflow δεν τη φτιάχνει πια. Ασφαλές να τρέχει κάθε φορά (δεν κάνει τίποτα αν λείπει).
  old-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Σβήσιμο της μνήμης ygeia-signing-v1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! keys=$(gh api "repos/$GH_REPO/actions/caches?per_page=100" --jq '.actions_caches[].key'); then
            echo "::warning title=Μνήμη Actions::Δεν διαβάστηκε η λίστα των μνημών· έλεγξε με το χέρι (Actions › Caches)"
            exit 0
          fi
          echo "Μνήμες Actions: $(printf '%s\n' "$keys" | grep -c . || true)"
          if printf '%s\n' "$keys" | grep -q '^ygeia-signing'; then
            for k in $(printf '%s\n' "$keys" | grep '^ygeia-signing' | sort -u); do
              gh api -X DELETE "repos/$GH_REPO/actions/caches?key=$k" > /dev/null && echo "::notice title=Μνήμη Actions::Σβήστηκε η $k"
            done
          else
            echo "::notice title=Μνήμη Actions::Καμία μνήμη ygeia-signing (σωστό)"
          fi
          if gh api "repos/$GH_REPO/actions/caches?per_page=100" --jq '.actions_caches[].key' | grep -q '^ygeia-signing'; then
            echo "::error title=Μνήμη Actions::Η μνήμη ygeia-signing υπάρχει ακόμα· σβήσ' τη με το χέρι (Actions › Caches)"
            exit 1
          fi
