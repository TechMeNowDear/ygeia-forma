# Χτίζει την εφαρμογή Android σε κάθε αλλαγή στο main και βάζει το APK
# στη σελίδα Releases του repository (έκδοση «latest»).
name: Χτίσιμο Android

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sentry_test:
        description: "Στείλε και ένα δοκιμαστικό σφάλμα στο Sentry"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9 # σταθερή έκδοση: μια νέα Flutter δεν αλλάζει σιωπηλά την εφαρμογή
          cache: true

      - name: Συμπλήρωση αρχείων Android
        run: |
          flutter --version
          echo "::notice title=Flutter::$(flutter --version | head -1)"
          # Φτιάχνει μόνο όσα αρχεία λείπουν· τα δικά μας μένουν όπως είναι.
          flutter create --org gr.ygeiaforma --project-name ygeia_forma --platforms android .
          test -f android/app/build.gradle.kts || { echo "Λείπει το android/app/build.gradle.kts"; exit 1; }
          cat android/ygeia/app-extra.gradle.kts >> android/app/build.gradle.kts
          sed -i 's/android:label="ygeia_forma"/android:label="Υγεία \&amp; Φόρμα"/' android/app/src/main/AndroidManifest.xml
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml
          # Διαδίκτυο: για το Open Food Facts (barcode) και την αναφορά σφαλμάτων (Sentry). Το Samsung Health δεν το χρειάζεται.
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          # Σύνδεση Oura: οθόνη επιστροφής ygeiaforma://oura-callback και <queries> για browser (η MainActivity δεν αλλάζει).
          python3 tools/android/patch_manifest.py android/app/src/main/AndroidManifest.xml
          grep -n 'INTERNET' android/app/src/main/AndroidManifest.xml

      # Το Gradle κατεβαίνει από το GitHub· μνήμη + ξαναδοκιμή, γιατί κάποιες φορές απαντά 504 (8/11).
      - name: Gradle (μνήμη και κατέβασμα με ξαναδοκιμή)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2/files-2.1
            ~/.gradle/caches/modules-2/metadata-*
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle.kts') }}
          restore-keys: gradle-
      - name: Gradle (κατέβασμα)
        run: |
          cd android
          for i in 1 2 3 4 5; do ./gradlew --version --console=plain >/dev/null 2>&1 && exit 0; echo "Ξαναδοκιμή $i"; sleep $((i * 20)); done
          ./gradlew --version --console=plain

      - name: Κλειδί υπογραφής
        env:
          KEYSTORE_B64: ${{ secrets.YGEIA_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.YGEIA_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            mkdir -p "$HOME/.ygeia-secret"
            echo "$KEYSTORE_B64" | base64 -d > "$HOME/.ygeia-secret/release.jks"
            store="$HOME/.ygeia-secret/release.jks"
            pw="$KEYSTORE_PASSWORD"
            echo "Κλειδί από τα Secrets του repository."
          else
            # Ποτέ νέο κλειδί: ένα νέο κλειδί σημαίνει ότι η έκδοση δεν μπαίνει πάνω στην παλιά
            # και η απεγκατάσταση σβήνει τα δεδομένα του κινητού. Καλύτερα να σταματήσει το χτίσιμο.
            echo "::error title=Κλειδί υπογραφής::Δεν βρέθηκε το κλειδί υπογραφής στα Secrets (YGEIA_KEYSTORE_B64, YGEIA_KEYSTORE_PASSWORD). Το χτίσιμο σταματά για να μη φτιαχτεί έκδοση με άλλο κλειδί."
            exit 1
          fi
          echo "::add-mask::$pw"
          fp="$(keytool -list -v -keystore "$store" -storepass "$pw" -alias ygeia | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')"
          [ -n "$fp" ] || { echo "::error title=Κλειδί υπογραφής::Δεν διαβάστηκε το κλειδί (λάθος κωδικός ή αρχείο)."; exit 1; }
          echo "::notice title=Αποτύπωμα κλειδιού::SHA-256 $fp"
          # App Link της Oura: το site/public/.well-known/assetlinks.json πρέπει να έχει αυτό το αποτύπωμα (ανεβαίνει με το χέρι).
          # Δύο αντίγραφα: το drag and drop του Netlify παραλείπει τον κρυφό .well-known (δες site/README.md).
          for f in site/public/.well-known/assetlinks.json site/public/assetlinks.json; do
            if [ -f "$f" ] && ! grep -q "$fp" "$f"; then
              echo "::warning title=assetlinks.json::Το $f δεν έχει το αποτύπωμα του κλειδιού υπογραφής. Η επιστροφή από την Oura θα περνά από τη σελίδα αντί για App Link ώσπου να διορθωθεί και να ξαναανέβει στο Netlify."
            fi
          done
          echo "YGEIA_KEYSTORE=$store" >> "$GITHUB_ENV"
          echo "YGEIA_KEYSTORE_PASSWORD=$pw" >> "$GITHUB_ENV"

      # Έλεγχος 8/11: το κλειδί υπάρχει μόνο στα Secrets· καμία προσωρινή μνήμη και καμία εξαγωγή του.
      - name: Ανάλυση κώδικα (σταματά μόνο σε σφάλματα)
        run: |
          set -o pipefail
          # Έλεγχος 4/11 (A14): σφάλματα του analyzer σταματούν το χτίσιμο· προειδοποιήσεις και υποδείξεις όχι (φαίνονται).
          if ! flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log; then
            msg=$(grep -E " error " analyze.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Ανάλυση κώδικα::$msg"
            exit 1
          fi
          echo "::notice title=Ανάλυση κώδικα::$(tail -1 analyze.log | tr -cd '[:print:]' | tail -c 120)"

      - name: Έλεγχοι
        env:
          TZ: Europe/Athens
        run: |
          set -o pipefail
          # Όλοι οι έλεγχοι εκτός από τα στιγμιότυπα και τη ζωντανή δοκιμή Sentry, με ώρα Αθήνας
          # (ώστε να πιάνονται λάθη στην αλλαγή ώρας).
          files=$(ls test/*_test.dart | grep -v -e screens_test -e sentry_live_test -e oura_sandbox_live_test)
          if ! flutter test $files 2>&1 | tee tests.log; then
            grep -E -B2 -A8 "Error:|Expected:|FAILED|failed" tests.log | head -120 > errors.txt || true
            [ -s errors.txt ] || tail -80 tests.log > errors.txt
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' errors.txt)
            echo "::error title=Σφάλμα ελέγχων::$msg"
            exit 1
          fi

      - name: Χτίσιμο APK
        run: |
          set -o pipefail
          if ! flutter build apk --release --target-platform android-arm64 \
            --build-name=0.1.${{ github.run_number }} --build-number=${{ github.run_number }} 2>&1 | tee build.log; then
            # Τα σφάλματα γίνονται «σημειώσεις» (annotations), ώστε να διαβάζονται και χωρίς το πλήρες log.
            grep -E -A3 "^e: |error:|Error:|What went wrong|ERROR|Missing class|Unresolved reference|Execution failed" build.log | head -150 > errors.txt || true
            [ -s errors.txt ] || tail -120 build.log > errors.txt
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' errors.txt)
            echo "::error title=Σφάλμα χτισίματος::$msg"
            exit 1
          fi
          cp build/app/outputs/flutter-apk/app-release.apk ygeia-forma-${{ github.run_number }}.apk
          ls -lh ygeia-forma-*.apk

      # Και στο main (A14): οι έλεγχοι Kotlin σε απλό JVM, πριν δημοσιευτεί η έκδοση.
      - name: Έλεγχοι Kotlin (JVM, χωρίς συσκευή)
        run: |
          set -o pipefail
          cd android
          if ! ./gradlew :app:testDebugUnitTest --console=plain 2>&1 | tee ../kotlin-tests.log; then
            grep -E -A6 "FAILED|AssertionError|^e: |What went wrong" ../kotlin-tests.log | head -80 > ../errors.txt || true
            [ -s ../errors.txt ] || tail -80 ../kotlin-tests.log > ../errors.txt
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' ../errors.txt)
            echo "::error title=Έλεγχοι Kotlin::$msg"
            exit 1
          fi
          # Η Flutter βάζει το build του app στο ../build/app.
          n=$(find .. -path '*test-results/testDebugUnitTest/*' -name '*.xml' -exec grep -ho '<testsuite [^>]*tests="[0-9]*"' {} + 2>/dev/null \
            | grep -o 'tests="[0-9]*"' | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}' || true)
          echo "::notice title=Έλεγχοι Kotlin::${n:-0} έλεγχοι εντάξει"

      # Μόνο όταν το ζητήσουμε: πραγματικό σφάλμα στο Sentry με τον κώδικα της εφαρμογής και την ίδια έκδοση.
      # Ρολόι (8/11): η εφαρμογή Wear OS, με το ίδιο κλειδί υπογραφής (το θέλει η σύνδεση με το κινητό).
      - name: Χτίσιμο εφαρμογής ρολογιού
        env:
          YGEIA_BUILD: ${{ github.run_number }}
        run: |
          set -o pipefail
          cd android
          grep -q '":wear"' settings.gradle.kts || echo 'include(":wear")' >> settings.gradle.kts
          if ! ./gradlew :wear:testDebugUnitTest :wear:assembleRelease --console=plain 2>&1 | tee ../wear.log; then
            grep -E -A6 "FAILED|AssertionError|^e: |error:|What went wrong|Unresolved reference" ../wear.log | head -120 > ../errors.txt || true
            [ -s ../errors.txt ] || tail -100 ../wear.log > ../errors.txt
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' ../errors.txt)
            echo "::error title=Ρολόι::$msg"
            exit 1
          fi
          cd ..
          w=build/wear/outputs/apk/release/wear-release.apk
          test -f "$w" || { echo "::error title=Ρολόι::Δεν βγήκε υπογεγραμμένο APK ρολογιού"; ls -l build/wear/outputs/apk/release/ || true; exit 1; }
          python3 -I tools/check_wear_capability.py "$w"
          cp "$w" ygeia-forma-watch-${{ github.run_number }}.apk
          ls -lh ygeia-forma-watch-*.apk

      - name: Δοκιμαστικό σφάλμα στο Sentry
        if: contains(github.event.head_commit.message, '[sentry-test]') || inputs.sentry_test
        run: |
          set -o pipefail
          if ! flutter test test/sentry_live_test.dart --dart-define=SENTRY_LIVE=1 \
            --dart-define=APP_VERSION=0.1.${{ github.run_number }} 2>&1 | tee live.log; then
            msg=$(tail -60 live.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Δοκιμή Sentry::$msg"
            exit 1
          fi
          # Να έτρεξε πραγματικά (όχι «skipped»).
          test -f sentry_live_ok || { echo "::error title=Δοκιμή Sentry::Ο έλεγχος δεν έτρεξε"; exit 1; }
          echo "::notice title=Δοκιμή Sentry::Στάλθηκε δοκιμαστικό σφάλμα για ygeia-forma@0.1.${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ygeia-forma-${{ github.run_number }}
          path: ygeia-forma-*.apk
          retention-days: 14

  # Στιγμιότυπα οθονών με δείγμα δεδομένων, για έλεγχο της εμφάνισης.
  # Ανεβαίνουν στο branch «screenshots» (όχι στο main).
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9 # σταθερή έκδοση: μια νέα Flutter δεν αλλάζει σιωπηλά την εφαρμογή
          cache: true

      - name: Ζωγράφισμα οθονών
        run: |
          set -o pipefail
          if ! flutter test test/screens_test.dart --update-goldens 2>&1 | tee shots.log; then
            grep -E -A4 "Error:|error:|EXCEPTION|was thrown|overflowed|Expected|Test failed" shots.log | head -150 > errors.txt || true
            [ -s errors.txt ] || tail -120 shots.log > errors.txt
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' errors.txt)
            echo "::error title=Σφάλμα στιγμιοτύπων::$msg"
            ls -la test/shots || true
            exit 1
          fi
          ls -la test/shots || true

      - name: Ανέβασμα στο branch screenshots
        if: always()
        run: |
          [ -d test/shots ] || exit 0
          cp shots.log test/shots/ 2>/dev/null || true
          cd test/shots
          git init -q
          git checkout -q -b screenshots
          git add .
          git -c user.name="ygeia-ci" -c user.email="ci@ygeia.local" commit -qm "Στιγμιότυπα #${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots

  # Και στο main (A14): ανοίγει την εφαρμογή σε emulator Android 14. Αν κλείνει στο άνοιγμα, η έκδοση ΔΕΝ δημοσιεύεται
  # (έλεγχος 2, C7: το publish περιμένει και αυτόν τον έλεγχο).
  # (Μετά την #62: ένας κανόνας R8 που έλειπε την έκλεινε, ενώ όλοι οι άλλοι έλεγχοι ήταν πράσινοι.)
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Ελεύθερος χώρος στον δίσκο
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY" || true

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Συμπλήρωση αρχείων Android
        run: |
          flutter create --org gr.ygeiaforma --project-name ygeia_forma --platforms android .
          cat android/ygeia/app-extra.gradle.kts >> android/app/build.gradle.kts
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          # Σύνδεση Oura: οθόνη επιστροφής ygeiaforma://oura-callback και <queries> για browser (η MainActivity δεν αλλάζει).
          python3 tools/android/patch_manifest.py android/app/src/main/AndroidManifest.xml

      # Το Gradle κατεβαίνει από το GitHub· μνήμη + ξαναδοκιμή, γιατί κάποιες φορές απαντά 504 (8/11).
      - name: Gradle (μνήμη και κατέβασμα με ξαναδοκιμή)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2/files-2.1
            ~/.gradle/caches/modules-2/metadata-*
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle.kts') }}
          restore-keys: gradle-
      - name: Gradle (κατέβασμα)
        run: |
          cd android
          for i in 1 2 3 4 5; do ./gradlew --version --console=plain >/dev/null 2>&1 && exit 0; echo "Ξαναδοκιμή $i"; sleep $((i * 20)); done
          ./gradlew --version --console=plain

      - name: APK release για emulator (x86_64, ίδιοι κανόνες R8)
        run: flutter build apk --release --target-platform android-x64

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Άνοιγμα σε emulator
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BIN="$SDK/cmdline-tools/latest/bin"
          IMG="system-images;android-34;google_apis;x86_64"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$BIN/sdkmanager" --licenses > /dev/null || true
          "$BIN/sdkmanager" "emulator" "platform-tools" "$IMG" > sdk.log 2>&1 || true
          echo no | "$BIN/avdmanager" create avd -n smoke -k "$IMG" -d pixel_6 --force > /dev/null 2>&1 || \
            echo no | "$BIN/avdmanager" create avd -n smoke -k "$IMG" --force > /dev/null
          export PATH="$SDK/platform-tools:$SDK/emulator:$PATH"
          nohup emulator -avd smoke -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim \
            -no-snapshot -camera-back none -camera-front none -memory 4096 > emu.log 2>&1 &
          if ! timeout 600 adb wait-for-device; then
            echo "::warning title=Άνοιγμα::Ο emulator δεν ξεκίνησε· ο έλεγχος ανοίγματος δεν έγινε"; exit 1
          fi
          for i in $(seq 1 120); do
            [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ] && break
            sleep 5
          done
          sleep 15
          if bash tools/perf/smoke.sh build/app/outputs/flutter-apk/app-release.apk > smoke.log 2>&1; then
            echo "::notice title=Άνοιγμα::$(tail -1 smoke.log)"
          else
            msg=$(head -60 smoke.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Η εφαρμογή κλείνει στο άνοιγμα::$msg"
            exit 1
          fi

  # Έλεγχος 2, C7: η έκδοση μπαίνει στο Releases ΜΟΝΟ αν πέρασαν και το χτίσιμο (έλεγχοι Dart/Kotlin, κλειδί, αποτύπωμα)
  # ΚΑΙ το άνοιγμα στον emulator. Μια έκδοση που κλείνει στο άνοιγμα δεν φτάνει ποτέ στο κινητό (η επιστροφή σε
  # παλιότερη θα ήθελε απεγκατάσταση, που σβήνει το ημερολόγιο φαγητού).
  publish:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: android-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ygeia-forma-${{ github.run_number }}

      - name: Δημοσίευση στο Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          apk=ygeia-forma-${{ github.run_number }}.apk
          test -f "$apk"
          # Η εφαρμογή του ρολογιού μπαίνει δίπλα (εγκατάσταση στο ρολόι από υπολογιστή ή από το Play Console).
          watch=ygeia-forma-watch-${{ github.run_number }}.apk
          extra=""
          [ -f "$watch" ] && extra="$watch"
          # Πρώτα ένα αντίγραφο με δικό του όνομα: αν η δημοσίευση διακοπεί ανάμεσα στο σβήσιμο και στη δημιουργία της
          # «latest», η έκδοση υπάρχει ακόμα στο Releases.
          gh release create "build-${{ github.run_number }}" "$apk" $extra --target "${{ github.sha }}" \
            --title "Έκδοση #${{ github.run_number }}" --notes "Χτίστηκε από το commit ${{ github.sha }}." --prerelease
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$apk" $extra \
            --target "${{ github.sha }}" \
            --title "Τελευταία έκδοση · #${{ github.run_number }}" \
            --notes "Χτίστηκε από το commit ${{ github.sha }}. Στο Fold κατέβασε το ygeia-forma-${{ github.run_number }}.apk και πάτα «Εγκατάσταση». Το ygeia-forma-watch-${{ github.run_number }}.apk είναι για το ρολόι (δεν μπαίνει στο κινητό)."
          gh release delete "build-${{ github.run_number }}" --yes --cleanup-tag || true
