# Μέτρηση απόδοσης σε emulator Android: άνοιγμα, μνήμη, CPU, παρασκήνιο.
# Τρέχει με το χέρι (Actions › «Μέτρηση απόδοσης» › Run workflow), πριν από κάθε έκδοση για το κινητό.
# Δεν τρέχει σε κάθε αλλαγή, για να μην καίει λεπτά του GitHub Actions.
name: Μέτρηση απόδοσης

on:
  workflow_dispatch:

concurrency:
  group: perf
  cancel-in-progress: true

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Συμπλήρωση αρχείων Android
        run: |
          flutter create --org gr.ygeiaforma --project-name ygeia_forma --platforms android .
          cat android/ygeia/app-extra.gradle.kts >> android/app/build.gradle.kts
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Χτίσιμο APK για emulator (x86_64)
        run: |
          flutter build apk --release --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-release.apk perf.apk
          ls -lh perf.apk

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "Χωρίς KVM"

      - name: Emulator και μέτρηση
        run: |
          # Όλα σε ένα βήμα, με το log σε αρχείο (τα logs του Actions δεν διαβάζονται από έξω).
          {
            set -x
            SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            BIN="$SDK/cmdline-tools/latest/bin"
            IMG="system-images;android-34;google_apis;x86_64"
            yes | "$BIN/sdkmanager" --licenses > /dev/null || true
            "$BIN/sdkmanager" "emulator" "platform-tools" "$IMG" > sdk.log 2>&1 || tail -20 sdk.log
            echo no | "$BIN/avdmanager" create avd -n perf -k "$IMG" -d pixel_6 --force || \
              echo no | "$BIN/avdmanager" create avd -n perf -k "$IMG" --force
            export PATH="$SDK/platform-tools:$SDK/emulator:$PATH"
            nohup emulator -avd perf -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim \
              -no-snapshot -camera-back none -camera-front none -memory 4096 > emu.log 2>&1 &
            timeout 600 adb wait-for-device || { echo "Ο emulator δεν εμφανίστηκε"; tail -60 emu.log; }
            for i in $(seq 1 120); do
              [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ] && break
              sleep 5
            done
            adb shell getprop sys.boot_completed
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            sleep 20
            bash tools/perf/measure.sh perf.apk perf.md
            tail -30 emu.log
          } > perf.log 2>&1 || true

      - name: Αποτελέσματα
        if: always()
        run: |
          # Τα logs του Actions δεν διαβάζονται από έξω· τα αποτελέσματα γίνονται «σημειώσεις».
          if [ -f perf.md ]; then
            cat perf.md >> "$GITHUB_STEP_SUMMARY"
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' perf.md)
            echo "::notice title=Μέτρηση απόδοσης::$msg"
          fi
          if [ -f perf.log ]; then
            msg=$(tail -60 perf.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::warning title=Log μέτρησης::$msg"
          else
            echo "::error title=Μέτρηση::Δεν έτρεξε το script (ο emulator δεν ξεκίνησε;)"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-${{ github.run_number }}
          path: |
            perf.md
            perf.log
          retention-days: 90
