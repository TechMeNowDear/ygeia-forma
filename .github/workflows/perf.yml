# Μέτρηση απόδοσης σε emulator Android: άνοιγμα, μνήμη, CPU, παρασκήνιο.
# Τρέχει με το χέρι (Actions › «Μέτρηση απόδοσης» › Run workflow), πριν από κάθε έκδοση για το κινητό.
# Δεν τρέχει σε κάθε αλλαγή, για να μην καίει λεπτά του GitHub Actions.
name: Μέτρηση απόδοσης

on:
  workflow_dispatch:

concurrency:
  group: perf
  cancel-in-progress: true

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Συμπλήρωση αρχείων Android
        run: |
          flutter create --org gr.ygeiaforma --project-name ygeia_forma --platforms android .
          cat android/ygeia/app-extra.gradle.kts >> android/app/build.gradle.kts
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Χτίσιμο APK για emulator (x86_64)
        run: |
          flutter build apk --release --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-release.apk perf.apk
          ls -lh perf.apk

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Μέτρηση στον emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/perf/measure.sh perf.apk perf.md

      - name: Αποτελέσματα
        if: always()
        run: |
          [ -f perf.md ] && cat perf.md >> "$GITHUB_STEP_SUMMARY"
          [ -f perf.md ] && sed 's/^/PERF: /' perf.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-${{ github.run_number }}
          path: perf.md
          retention-days: 90
