name: ygeia_forma
description: "Υγεία & Φόρμα: προσωπική εφαρμογή υγείας, διατροφής και άσκησης."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

# Λίγες βιβλιοθήκες: μόνο ό,τι δίνει η ίδια η Flutter.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/foods/basic_foods.json
    - assets/exercises/exercises.json
    # Η άδεια της γραμματοσειράς (SIL OFL 1.1 θέλει να συνοδεύει τη γραμματοσειρά· έλεγχος 9/11, E3-21).
    - assets/fonts/Inter-OFL.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
