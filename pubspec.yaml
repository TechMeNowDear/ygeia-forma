name: ygeia_forma
description: "Υγεία & Φόρμα: προσωπική εφαρμογή υγείας, διατροφής και άσκησης."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

# Λίγες βιβλιοθήκες: μόνο ό,τι δίνει η ίδια η Flutter.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
